name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Version comes from app/package.json#packageManager (pnpm 9.15.9).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # postinstall runs `prisma generate`; no database connection is needed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Panda output
        run: |
          pnpm panda
          test -s styled-system/css/index.mjs

      # Warnings are reported but only lint errors fail the job.
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Audit harness self-check
        run: pnpm audit:harness:check

      - name: Lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml package.json
