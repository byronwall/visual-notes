name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Version comes from app/package.json#packageManager (pnpm 9.15.9).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      # postinstall runs `prisma generate`; no database connection is needed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Panda output
        run: |
          pnpm panda
          test -s styled-system/css/index.mjs

      # Warnings are reported but only lint errors fail the job.
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Audit harness self-check
        run: pnpm audit:harness:check

      - name: No tracked scratch files
        run: |
          tracked=$(git ls-files -- ':(glob,top)**/tmp/**' ':(glob,top)**/playwright/.auth/**')
          if [ -n "$tracked" ]; then echo "Scratch files are tracked:"; echo "$tracked"; exit 1; fi

      - name: Lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml package.json

  e2e:
    name: Browser regressions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visual_notes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/visual_notes_ci?schema=public
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: "true"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fresh throwaway values per run; masked so they never reach the log.
      - name: Generate test secrets
        run: |
          for key in AUTH_SECRET MAGIC_PASSWORD ARCHIVE_INGEST_TOKEN; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      # Playwright's webServer sources .env before `pnpm build && pnpm start`.
      - name: Write .env
        run: |
          env | grep -E '^(DATABASE_URL|AUTH_URL|AUTH_TRUST_HOST|AUTH_SECRET|MAGIC_PASSWORD|ARCHIVE_INGEST_TOKEN|OPENAI_API_KEY)=' > .env
          chmod 600 .env

      - name: Apply schema
        run: pnpm prisma migrate deploy

      # Database-backed unit tests skip unless this points at a loopback test DB.
      - name: Database unit tests
        run: pnpm vitest run src/services/research
        env:
          RESEARCH_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Only specs that pass on main today. Add a spec here once it passes.
      - name: Playwright
        run: pnpm exec playwright test archive-title-cancel auth-helper new-note-mobile live-note-updates inline-title-failed-save note-title-hydration late-note-share-responses path-editor-late-save path-editor-modal

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7
