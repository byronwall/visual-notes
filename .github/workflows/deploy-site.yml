name: Deploy site

# Builds the landing page in site/ and publishes it to GitHub Pages.
# Pull requests only build it, so a broken page fails before it merges.

on:
  pull_request:
    paths: [site/**, .github/workflows/deploy-site.yml]
  push:
    branches: [main]
    paths: [site/**, .github/workflows/deploy-site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # SITE_BASE is the GitHub Pages project path. Set it to / when the site gets its own domain.
      - run: pnpm build
        env:
          SITE_BASE: /visual-notes/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
