version: "3.9"

services:
  db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-visual_notes}
    ports:
      - "${DB_PORT_EXPOSED:-5432}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h db']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # /api/version reports it. Coolify sets it at runtime ("Runtime only"
      # source commit keeps the build cache); by hand: SOURCE_COMMIT=$(git rev-parse HEAD)
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
      # Auth config
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      VITE_AUTH_PATH: ${VITE_AUTH_PATH:-/api/auth}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      MAGIC_PASSWORD: ${MAGIC_PASSWORD:-magic-password}
      ARCHIVE_INGEST_TOKEN: ${ARCHIVE_INGEST_TOKEN:-change-me-archive-token}
      # ChatGPT MCP connector (off unless explicitly enabled)
      MCP_CONNECTOR_ENABLED: ${MCP_CONNECTOR_ENABLED:-false}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Live note updates over /ws/notes; "false" turns them off at runtime
      NOTE_LIVE_SYNC: ${NOTE_LIVE_SYNC:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      CLEANUP_DECIDER: ${CLEANUP_DECIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      UMAP_PYTHON_BIN: ${UMAP_PYTHON_BIN:-/app/.venv/bin/python}
      UMAP_MODEL_DIR: ${UMAP_MODEL_DIR:-/app/data/umap-models}
      # Database pieces (compose defaults)
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-visual_notes}
      # Constructed connection string for Prisma/Auth
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@${DB_HOST:-db}:${DB_PORT:-5432}/${DB_NAME:-visual_notes}?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/version').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Migrations and the search-text backfill run before the server listens.
      start_period: 120s
    ports:
      - "${APP_PORT:-3000}"
    volumes:
      - app-data:/app/data

volumes:
  db-data:
  app-data:
